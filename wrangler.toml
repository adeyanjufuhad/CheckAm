name = "checkam"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# Anonymous usage + feedback storage (no message text is ever stored).
# Created with `npx wrangler d1 create checkam`; tables from `npm run db:init`.
[[d1_databases]]
binding = "DB"
database_name = "checkam"
database_id = "121b1659-0d6a-4c76-96a4-34627d26124c"

# Cloudflare Workers AI for the optional "Ask AI" check (free daily allowance).
[ai]
binding = "AI"
